# Provider preferences. Keys stay in .env; this file picks models/behaviour.
llm:
  cascade: [anthropic, kimi, openrouter, deepseek, groq]
  models:
    anthropic: claude-3-5-haiku-latest
    kimi: moonshot-v1-8k
    openrouter: google/gemini-2.0-flash-001
    deepseek: deepseek-chat
    groq: llama-3.3-70b-versatile
  temperature: 0.9
chat:
  reply_chance: 0.7
  reaction_chance: 0.5
  max_burst_parts: 3
radar:
  use_llm_classifier: false
captcha:
  provider: ""                     # 2captcha | anticaptcha
  timeout_seconds: 180
sms:
  provider: ""                     # sms-activate | 5sim
  country: "6"
