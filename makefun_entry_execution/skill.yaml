    success_criterion: At least 80 percent of make.fun entries submitted in the window reach a sealed submission on the first witnessed attempt with no helper security-gate stop and no thinking_reproduces or seal rejection, compared with multiple such stops and rejections across the 2026-11-23 to 2026-11-24 entries.
