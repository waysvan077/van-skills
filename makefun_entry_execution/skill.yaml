  needs_review: false
  rationale: Across 2026-11-23 to 2026-11-24 delegated helpers repeatedly stopped on the security gate for official make.fun kit and vendor files even after the user approved the work, including the card-game vendor file, the BTC race variant, tiny-chess twice, one-liner batches and the GTA 3D submit. Separately, witnessed entries were rejected at the seal and thinking gates when a recorder died, a session log was rewritten, or a bundle carried old sessions predating the competition, and the fixes that worked were a fast build in one witnessed session with an immediate seal and a clean rebundle from the builder session alone. Van also first told the user a 3D entry would not cancel a 2D entry, which was wrong under Force Last, and the counted entry only became the 3D resubmission after an explicit user approval. The existing makefun_recording_seal skill covers seal mechanics but does not cover delegation routing, start-after-open timing, bundle scope, or Force Last, so this new skill codifies those four uncovered rules and links to that seal skill instead of repeating it. This repair keeps the Bangun division intact by delegating to one Bangun builder, and keeps the seal boundary intact by keeping the lead silent while the builder does all build and seal work, with approval and kit verification carried in the builder brief before recording starts.
